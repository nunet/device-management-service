---
version: "V1"

edge_constraints:
  - edges: ["edge1", "edge2"]
    rtt: 0
    bw: 0
    symetric: false

supervisor:
  strategy: ""
  alloctions:
    - allocation1
    - allocation2
  children:
    - strategy: ""
      alloctions:
        - allocation2
        - allocation3

keys:
  keys1: "/home/dave/.ssh/id_dbr.pub"
  keys2: "/home/dave/.ssh/id_ed25519"

scripts:
  script1: "nunet.sh"
  script2: "main.go"

resources:
  rc1:
    cpu:
      arch: "x86"
      freq: 10000
      cores: 2
    ram:
      speed: 10000
      size: 10000
    gpus:
      - vendor: "nvidia"
        memory: 10000
    disk:
      size: 10000

volumes:
  volume1:
    type: output
    remote:
      type: ipfs
      endpoint: "123"

allocations:
  allocation1:
    executor: "docker"
    resources: "rc1"
    execution:
      type: docker
      image: "alpine"
      environment:
        - ENV1: "value"
      command: "echo task 1"
    volumes:
      volume1:
        mountpoint: /
      volume2:
        type: input
        remote:
          type: s3
          bucket: "bucket1"
        mountpoint: "/"
    dns_name: "node1"
    keys:
      - "key1"
      - "key2"
    provision:
      - "script1"
      - "script2"
    health_check: ""
