version: "V1"

allocations:
    nginx1:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # in GB
            disk:
                size: 1 # in GB
        execution:
            type: docker
            image: ubuntu:22.04
            cmd: ["sleep", "1000"]
            working_directory: /
        dnsname: mydocker
        healthcheck:
            type: command
            exec: ["echo", "hello"]
            response:
                type: string
                value: "hello"
        dns_name: nginxdemo-alloc1

    nginx2:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # in GB
            disk:
                size: 1 # in GB
        execution:
            type: docker
            image: nginxdemos/hello:plain-text
            working_directory: /
        dnsname: mydocker
        keys: []
        provision: []
        healthcheck:
            type: command
            exec: ["nginx", "-t"]
            response:
                type: string
                value: "nginx: the configuration file /etc/nginx/nginx.conf syntax is ok"
        dns_name: nginxdemo-alloc2

nodes:
    node1:
        allocations:
            - nginx1
    node2:
        allocations:
            - nginx2
        ports:
            - private: 80
              public: 7224
              allocation: nginx2


subnet:
    join: true
