version: "V1"

allocations:
  fireflybootstrap:
    type: service
    executor: docker
    resources:
      cpu:
        cores: 1
      gpus: []
      ram:
        size: 1 # in GB
      disk:
        size: 2 # in GB
    execution:
      user: root
      type: docker
      image: ghcr.io/f1r3fly-io/rnode
      cmd: ["run", "--host=rnode.bootstrap", "--allow-private-addresses", "-Dlogback.configurationFile=/var/lib/rnode/logback.xml"]
      environment:
        - "BOOTSTRAP_HOST=rnode.bootstrap"
        - "BOOTSTRAP_PRIVATE_KEY=5f668a7ee96d944a4494cc947e4005e172d7ab3461ee5538f1f2a45a835e9657"
    keys: []
    provision: []
    dns_name: rnode.bootstrap
    # volume:
    #  type: glusterfs
    #  read_only: false
    #  name: volumenunet123
    #  mount_destination: "/home"
    #  servers: ["host"]
    #  client_private_key: /client_certs/client_gluster_tls_certs/glusterfs.key
    #  client_pem: /client_certs/client_gluster_tls_certs/glusterfs.pem
    #  client_ca: /client_certs/client_gluster_tls_certs/glusterfs.ca
    volume:
      type: local
      src: /home/blockchain/Desktop/rnode.bootstrap/
      read_only: false
      name: localVol
      mount_destination: "/var/lib/rnode/"
  fireflyvalidator:
    type: service
    executor: docker
    resources:
      cpu:
        cores: 1
      gpus: []
      ram:
        size: 1 # in GB
      disk:
        size: 2 # in GB
    execution:
      user: root
      type: docker
      image: ghcr.io/f1r3fly-io/rnode
      cmd: ["run", "--host=rnode.validator1", "--allow-private-addresses", "-Dlogback.configurationFile=/var/lib/rnode/logback.xml"]
      environment:
        - "VALIDATOR1_HOST=rnode.validator1"
        - "BOOTSTRAP_HOST=rnode.bootstrap"
        - "VALIDATOR1_PRIVATE_KEY=357cdc4201a5650830e0bc5a03299a30038d9934ba4c7ab73ec164ad82471ff9"
    keys: []
    provision: []
    dns_name: rnode.validator1
    # volume:
    #  type: glusterfs
    #  read_only: false
    #  name: volumenunet123
    #  mount_destination: "/home"
    #  servers: ["host"]
    #  client_private_key: /client_certs/client_gluster_tls_certs/glusterfs.key
    #  client_pem: /client_certs/client_gluster_tls_certs/glusterfs.pem
    #  client_ca: /client_certs/client_gluster_tls_certs/glusterfs.ca
    volume:
      type: local
      src: /home/blockchain/Desktop/rnode.validator1/
      read_only: false
      name: localVol
      mount_destination: "/var/lib/rnode/"

nodes:    
  node1:
    allocations:
      - fireflybootstrap
      - fireflyvalidator
    ports:
      - private: 40400
        public: 40400
        allocation: fireflybootstrap
      - private: 40401
        public: 40401
        allocation: fireflybootstrap
      - private: 40402
        public: 40402
        allocation: fireflybootstrap
      - private: 40403
        public: 40403
        allocation: fireflybootstrap
      - private: 40404
        public: 40404
        allocation: fireflybootstrap
      #second node
      - private: 40400
        public: 50400
        allocation: fireflyvalidator
      - private: 40401
        public: 50401
        allocation: fireflyvalidator
      - private: 40402
        public: 50402
        allocation: fireflyvalidator
      - private: 40403
        public: 50403
        allocation: fireflyvalidator
      - private: 40404
        public: 50404
        allocation: fireflyvalidator
