version: "V1"

allocations:
    alloc1:
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # in GB
            disk:
                size: 1 # in GB
        execution:
            type: docker
            image: nginxdemos/hello
            working_directory: /
        dnsname: mydocker
        keys: []
        provision: []
        healthcheck:
            type: command
            exec: ["nginx", "-t"]
            response:
                type: string
                value: "nginx: the configuration file /etc/nginx/nginx.conf syntax is ok"
        dns_name: nginxdemo-alloc

nodes:
    node1:
        allocations:
            - alloc1
