receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:

exporters:
  # This makes the Collector act like a Prometheus Target
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "otel" # prefixes metrics with otel_

  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]