version: "V1"

allocations:
    httpbin:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # GiB
            disk:
                size: 1 # GiB
        execution:
            type: docker
            image: kennethreitz/httpbin 

    helloAlloc:
        type: task
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1
            disk:
                size: 1
        execution:
            type: docker
            image: hello-world
            working_directory: /
        keys: []
        provision: []
        dns_name: hellodocker

    nginx:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # in GB
            disk:
                size: 1 # in GB
        execution:
            type: docker
            image: ubuntu:22.04
            cmd: ["sleep", "1000"]
            working_directory: /
        dnsname: mydocker
        healthcheck:
            type: command
            exec: ["echo", "hello"]
            response:
                type: string
                value: "hello"

nodes:
    node1:
        allocations:
            - httpbin
        ports:
            - public: 7500
              private: 80
              allocation: httpbin
    addedNode:
        allocations:
          - helloAlloc
          - nginx
        ports:
            - public: 7501
              private: 80
              allocation: nginx
