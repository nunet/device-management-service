version: "V1"

allocations:
    httpbin:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # GiB
            disk:
                size: 1 # GiB
        execution:
            type: docker
            image: kennethreitz/httpbin

    nginx:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # in GB
            disk:
                size: 1 # in GB
        execution:
            type: docker
            image: ubuntu:22.04
            cmd: ["sleep", "1000"]
            working_directory: /
        dnsname: mydocker
        healthcheck:
            type: command
            exec: ["echo", "hello"]
            response:
                type: string
                value: "hello"

    buildpack:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # GiB
            disk:
                size: 1 # GiB
        execution:
            type: docker
            image: buildpack-deps
            cmd: [tail, -f, /dev/null]
nodes:
    node1:
        allocations:
            - httpbin
            - nginx
        ports:
            - public: 7500
              private: 80
              allocation: httpbin
            - public: 7501
              private: 80
              allocation: nginx
    node2:
        allocations:
            - buildpack
        ports:
            - public: 7506
              private: 80
              allocation: buildpack
