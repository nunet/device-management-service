---
- hosts: all
  remote_user: root
  vars:
    volume_test_name: gvtest
  tasks:
    - name: Include vars
      include_vars: ../vars/main.yml
    - name: Read configs
      include_tasks: ../tasks/read-config.yml
    - name: Create random string
      set_fact:
        random_string: "{{ lookup('community.general.random_string', length=12, base64=True) }}"
      delegate_to: 127.0.0.1
      run_once: true

    - name: Create volume, test and destroy
      block:
      - name: Create {{ volume_test_name }} folder
        ansible.builtin.file:
          path: "/data/brick1/{{ volume_test_name }}"
          state: directory
        when: inventory_hostname in groups.glusterfs_servers

      - name: Create {{ volume_test_name }} volume
        shell: |
          gluster volume create {{ volume_test_name }} \
            {% if (groups.glusterfs_servers | length) > 1 -%}
            replica {{ groups.glusterfs_servers | length }} \
            {% endif -%}
            {% for server in groups.glusterfs_servers -%}
            {{ hostvars[server].ansible_host }}:/data/brick1/{{ volume_test_name }} \
            {% endfor -%}
            force
          gluster volume set {{ volume_test_name }} server.ssl on
          gluster volume set {{ volume_test_name }} client.ssl on
          gluster volume start {{ volume_test_name }}
        delegate_to: "{{ glusterfs_main_node }}"
        run_once: true
      - name: Get {{ volume_test_name }} info
        shell: |
          gluster volume info {{ volume_test_name }}
        register: test_volume_info
        delegate_to: "{{ glusterfs_main_node }}"
        run_once: true
      - name: Display {{ volume_test_name }} info
        debug:
          var: test_volume_info.stdout_lines
        delegate_to: 127.0.0.1
        run_once: true

      - name: Install client dependencies
        ansible.builtin.apt:
          name:
            - glusterfs-client
            - attr
            - less
          state: present
        delegate_to: "{{ groups.glusterfs_clients[0] }}"
        run_once: true
      - name: Create mount volume on client
        ansible.builtin.file:
          path: /mnt/gluster-test
          state: directory
        delegate_to: "{{ groups.glusterfs_clients[0] }}"
        run_once: true
      - name: Mount volume on client and add random string
        shell: |
          set -euo pipefail
          modprobe fuse
          mount -t glusterfs {{ hostvars[glusterfs_main_node].ansible_host }}:/{{ volume_test_name }} /mnt/gluster-test
          echo {{ random_string }} > /mnt/gluster-test/test
        args:
          executable: /bin/bash
        delegate_to: "{{ groups.glusterfs_clients[0] }}"
        run_once: true

      - name: Display random string
        debug:
          var: random_string
        delegate_to: 127.0.0.1
        run_once: true
      - name: Test random string from server
        shell: |
          if ! test -f /data/brick1/{{ volume_test_name }}/test; then
            echo "file doesn't exist"
            exit 1
          fi
          file_content=$(cat /data/brick1/{{ volume_test_name }}/test)
          if [[ "$file_content" != "{{ random_string }}" ]]; then
            echo "file content doesn't match: expected {{ random_string }} got $file_content"
            exit 2
          fi
        args:
          executable: /bin/bash
        delegate_to: "{{ glusterfs_main_node }}"
        run_once: true
        
      rescue:
      - name: Something went wront with the tests, pausing until you can investigate, after which the VMs will be reset
        ansible.builtin.pause:

      always:
      - name: Unmount volume on client
        shell: |
          umount /mnt/gluster-test
          rm -rf /mnt/gluster-test
        delegate_to: "{{ groups.glusterfs_clients[0] }}"
        run_once: true
      - name: Delete {{ volume_test_name }} volume
        shell: |
          yes | gluster volume stop {{ volume_test_name }}
          yes | gluster volume delete {{ volume_test_name }}
        delegate_to: "{{ glusterfs_main_node }}"
        run_once: true
      - name: Delete {{ volume_test_name }} folder
        ansible.builtin.file:
          path: "/data"
          state: absent

