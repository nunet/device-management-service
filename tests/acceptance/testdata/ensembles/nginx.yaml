# Note: keep allocations's resources equal as the assertions
# are taking that into account
version: "V1"
nginx_wrapper: &nginx_service
  type: service
  executor: docker
  resources:
    cpu:
      cores: 1
    gpus: []
    ram:
      size: 0.5
    disk:
      size: 0.5
  execution:
    type: docker
    image: nginxdemos/hello:plain-text
    working_directory: /
  keys: []
  provision: []
  healthcheck:
    type: command
    exec: ["nginx", "-t"]
    response:
      type: string
      value: "nginx: the configuration file /etc/nginx/nginx.conf syntax is ok"
    dns_name: nginxdemo
allocations:
  nginx: *nginx_service
nodes:
  node1:
    allocations:
      - nginx
    ports:
      - private: 80
        public: 50001
        allocation: nginx
subnet:
  join: true
