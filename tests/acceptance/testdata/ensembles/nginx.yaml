# Note: keep allocations's resources equal as the assertions
# are taking that into account
version: "V1"
allocations:
  nginx:
    type: service
    executor: docker
    resources:
      cpu:
        cores: 1
      gpus: []
      ram:
        size: 0.5 # in GB
      disk:
        size: 0.5 # in GB
    execution:
      type: docker
      image: nginxdemos/hello:plain-text
      working_directory: /
    dnsname: mydocker
    keys: []
    provision: []
    healthcheck:
      type: command
      exec: ["nginx", "-t"]
      response:
        type: string
        value: "nginx: the configuration file /etc/nginx/nginx.conf syntax is ok"
    dns_name: nginxdemo
nodes:
  node1:
    allocations:
      - nginx
    ports:
      - private: 80
        public: 17000
        allocation: nginx
subnet:
  join: true
