version: "V1"

allocations:
    alloc1:
        type: task
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1
            disk:
                size: 1
        execution:
            type: docker
            image: hello-world
nodes:
    node1:
        allocations:
            - alloc1
        location:
          accept:
            - continent: "AS"
              country: "CN"
