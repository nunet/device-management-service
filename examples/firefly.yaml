version: "V1"

allocations:
  fireflybootstrap:
    type: service
    executor: docker
    resources:
      cpu:
        cores: 1
      gpus: []
      ram:
        size: 1 # in GB
      disk:
        size: 2 # in GB
    execution:
      user: root
      type: docker
      image: registry.gitlab.com/nunet/device-management-service/f1r3fly-rnode
      cmd: ["run", "-Dlogback.configurationFile=/var/lib/rnode/logback.xml"]
      environment:
        - "BOOTSTRAP_HOST=rnode.bootstrap"
        - "BOOTSTRAP_PRIVATE_KEY=5f668a7ee96d944a4494cc947e4005e172d7ab3461ee5538f1f2a45a835e9657"
    keys: []
    provision: []
    dns_name: rnode.bootstrap
    volume:
     type: glusterfs
     read_only: false
     name: firefly_bootstrap
     mount_destination: "/var/lib/rnode/"
     servers: ["65.108.248.215"]
     client_private_key: /{path}/glusterfs.key
     client_pem: /{path}/glusterfs.pem
     client_ca: /{path}/glusterfs.ca
  fireflyvalidator:
    type: service
    executor: docker
    resources:
      cpu:
        cores: 1
      gpus: []
      ram:
        size: 1 # in GB
      disk:
        size: 2 # in GB
    execution:
      user: root
      type: docker
      image: registry.gitlab.com/nunet/device-management-service/f1r3fly-rnode
      cmd: ["run","-Dlogback.configurationFile=/var/lib/rnode/logback.xml"]
      environment:
        - "VALIDATOR1_HOST=rnode.validator1"
        - "BOOTSTRAP_HOST=rnode.bootstrap"
        - "VALIDATOR1_PRIVATE_KEY=357cdc4201a5650830e0bc5a03299a30038d9934ba4c7ab73ec164ad82471ff9"
    keys: []
    provision: []
    dns_name: rnode.validator1
    volume:
     type: glusterfs
     read_only: false
     name: firefly_validator
     mount_destination: "/var/lib/rnode/"
     servers: ["65.108.248.215"]
     client_private_key: /{path}/glusterfs.key
     client_pem: /{path}/glusterfs.pem
     client_ca: /{path}/glusterfs.ca

nodes:    
  node1:
    allocations:
      - fireflybootstrap
    ports:
      - private: 40400
        public: 40400
        allocation: fireflybootstrap
      - private: 40401
        public: 40401
        allocation: fireflybootstrap
      - private: 40402
        public: 40402
        allocation: fireflybootstrap
      - private: 40403
        public: 40403
        allocation: fireflybootstrap
      - private: 40404
        public: 40404
        allocation: fireflybootstrap

  node2:
    allocations:
      - fireflyvalidator
    ports:
      - private: 40400
        public: 50400
        allocation: fireflyvalidator
      - private: 40401
        public: 50401
        allocation: fireflyvalidator
      - private: 40402
        public: 50402
        allocation: fireflyvalidator
      - private: 40403
        public: 50403
        allocation: fireflyvalidator
      - private: 40404
        public: 50404
        allocation: fireflyvalidator