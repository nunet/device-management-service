version: "V1"

allocations:
    alloc1:
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # in GB
            disk:
                size: 1 # in GB
        execution:
            type: docker
            image: nginxdemos/hello
            working_directory: /
        dnsname: nginx-demo
nodes:
    node1:
        allocations:
            - alloc1
        ports:
            - public: 8080
              private: 80
              allocation: alloc1
