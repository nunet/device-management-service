version: "V1"

allocations:
    alloc1:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # GiB
            disk:
                size: 1 # GiB
        execution:
            type: docker
            image: kennethreitz/httpbin 
    alloc2:
        type: service
        executor: docker
        resources:
            cpu:
                cores: 1
            gpus: []
            ram:
                size: 1 # GiB
            disk:
                size: 1 # GiB
        execution:
            type: docker
            image: buildpack-deps
            cmd: [tail, -f, /dev/null]
nodes:
    node1:
        allocations:
            - alloc1
        ports:
            - public: 17000
              private: 80
              allocation: alloc1
    node2:
        allocations:
            - alloc2
        ports:
            - public: 17001
              private: 80
              allocation: alloc2
