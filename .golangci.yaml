run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - misspell
    - govet
    - revive
    - gofumpt
    - unparam
    - goconst
    - prealloc
    - stylecheck
    - unconvert
    - errcheck
    - ineffassign
    - unused
    - tparallel
    - whitespace
    - staticcheck
    - gosimple
    - gocritic
    - nolintlint
  gosec:
    excludes:
    - G115